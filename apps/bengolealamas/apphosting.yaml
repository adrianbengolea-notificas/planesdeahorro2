# Firebase App Hosting — backend bengolealamas (sitio institucional).
# Crear el backend en consola o CLI antes del primer deploy (ver docs/multi-site-architecture.md).

runConfig:
  maxInstances: 1

# Monorepo: el root del backend en consola es apps/bengolealamas, pero @repo/* vive en la raíz del repo.
scripts:
  buildCommand: cd ../.. && npm ci && npm run build:bl
  runCommand: cd ../.. && npm run start:bl

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://bengolealamas.com.ar
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_ID
    value: bl
    availability:
      - BUILD
      - RUNTIME
