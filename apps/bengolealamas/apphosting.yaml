# Firebase App Hosting — backend bengolealamas (sitio institucional).
# Crear el backend en consola o CLI antes del primer deploy (ver docs/multi-site-architecture.md).

runConfig:
  maxInstances: 1

# Root directory en Firebase: apps/bengolealamas (lockfile local + file:../../packages/*).

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://bengolealamas.com.ar
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_ID
    value: bl
    availability:
      - BUILD
      - RUNTIME
  # Backend IA (app raíz / adrianbengolea.com.ar). Mismo INTAKE_BRIDGE_SECRET que planesdeahorro2.
  - variable: INTAKE_BRIDGE_URL
    value: https://adrianbengolea.com.ar/api/case-intake/continue
    availability:
      - RUNTIME
  - variable: INTAKE_BRIDGE_SECRET
    secret: INTAKE_BRIDGE_SECRET
    availability:
      - RUNTIME
  # Resend: listas CSV + envío de notas. Crear el secreto en el backend bengolealamas
  # (`firebase apphosting:secrets:set RESEND_API_KEY`). From institucional del estudio.
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_BL_FROM
    value: estudio@bengolealamas.com.ar
    availability:
      - RUNTIME
  - variable: RESEND_BL_REPLY_TO
    value: estudio@bengolealamas.com.ar
    availability:
      - RUNTIME
