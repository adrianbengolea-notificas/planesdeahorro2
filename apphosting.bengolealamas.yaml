# Referencia — NO usar con Root directory «.» en el backend bengolealamas.
#
# APP_SITE_ID + npm run build en la raíz hace que el adaptador Next.js de App Hosting
# falle (busca .next en la raíz; el sitio B&L compila en apps/bengolealamas/.next).
#
# Configuración correcta:
#   Consola → backend bengolealamas → Root directory = apps/bengolealamas
#   Env / YAML activo: apps/bengolealamas/apphosting.yaml

runConfig:
  maxInstances: 1

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://bengolealamas--planesdeahorro-77c3e.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_ID
    value: bl
    availability:
      - BUILD
      - RUNTIME
